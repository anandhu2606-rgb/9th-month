<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f9d6dc">
  <title>Happy 9th Anniversary, Sreee</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="flight-layer" aria-hidden="true">
    <span class="flight flight-heart flight-one">♥</span>
    <span class="flight flight-butterfly flight-red flight-two">🦋</span>
    <span class="flight flight-heart flight-three">♥</span>
    <span class="flight flight-butterfly flight-violet flight-four">🦋</span>
    <span class="flight flight-butterfly flight-blue flight-five">🦋</span>
    <span class="flight flight-heart flight-six">♥</span>
    <span class="flight flight-butterfly flight-red flight-seven">🦋</span>
    <span class="flight flight-heart flight-eight">♥</span>
    <span class="flight flight-butterfly flight-violet flight-nine">🦋</span>
    <span class="flight flight-butterfly flight-blue flight-ten">🦋</span>
  </div>
  <div class="edge-decor" aria-hidden="true">
    <span class="edge-sticker sticker-bear sticker-left">🧸</span>
    <span class="edge-sticker sticker-rose sticker-right">🌹</span>
    <span class="edge-sticker sticker-flower sticker-left-low">🌼</span>
    <span class="edge-sticker sticker-bear sticker-right-low">🧸</span>
    <span class="edge-sticker sticker-rose sticker-left-mid">🌹</span>
    <span class="edge-sticker sticker-flower sticker-right-mid">🌸</span>
  </div>

  <header class="topbar">
    <a class="wordmark" href="#top" aria-label="Back to the top">little love letter <span>♡</span></a>
    <div class="topbar-actions">
      <span id="save-status" class="save-status" role="status">Saved on this device</span>
      <button id="edit-toggle" class="edit-toggle" type="button">Edit Page</button>
    </div>
  </header>

  <div id="editor-tools" class="editor-tools" hidden>
    <span class="editor-label">Page editor</span>
    <button id="add-section" class="tool-button" type="button">＋ Text section</button>
  </div>

  <div id="top" class="page-shell">
    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow"><span>✿</span> a little celebration of us <span>✿</span></p>
      <h1 id="page-title">HAPPY 9TH<br class="mobile-break"> ANNIVERSARY</h1>
      <p class="hero-subtitle">Nine months of my favorite kind of forever.</p>
      <div class="hero-rule"><span>♥</span></div>
    </section>

    <main id="story" class="story" aria-label="Our anniversary memories"></main>

    <footer class="closing-note">
      <span class="closing-flower" aria-hidden="true">✿</span>
      <p>Here's to every little moment still waiting for us.</p>
      <span class="closing-flower" aria-hidden="true">✿</span>
    </footer>
  </div>

  <input id="photo-picker" class="visually-hidden" type="file" accept="image/*" multiple>
</body>
</html>
